<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forms — Test App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Main navigation">
      <p class="brand">TestApp</p>
      <a class="nav-link" href="index.html" data-nav="home">Home</a>
      <a class="nav-link" href="widgets.html" data-nav="widgets">Widgets</a>
      <a class="nav-link active" href="forms.html" data-nav="forms">Forms</a>
      <a class="nav-link" href="about.html" data-nav="about">About</a>
    </aside>
    <main class="main" id="page-forms">
      <h1>Forms</h1>
      <p class="subtitle">Contact / signup style form for fill and submit tests.</p>

      <form class="form" id="contact-form" data-testid="contact-form" novalidate>
        <label>
          Full name
          <input type="text" name="name" id="name" data-testid="input-name" required placeholder="Ada Lovelace" />
        </label>
        <label>
          Email
          <input type="email" name="email" id="email" data-testid="input-email" required placeholder="ada@example.com" />
        </label>
        <label>
          Role
          <select name="role" id="role" data-testid="select-role">
            <option value="">Select a role</option>
            <option value="admin">Admin</option>
            <option value="editor">Editor</option>
            <option value="viewer">Viewer</option>
          </select>
        </label>
        <label>
          Message
          <textarea name="message" id="message" data-testid="input-message" placeholder="Tell us something…"></textarea>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="newsletter" id="newsletter" data-testid="check-newsletter" />
          Subscribe to newsletter
        </label>
        <div class="btn-row">
          <button type="submit" class="primary" data-testid="btn-submit">Submit</button>
          <button type="reset" data-testid="btn-form-reset">Clear</button>
        </div>
      </form>

      <div class="form-result" id="form-result" data-testid="form-result" role="status" aria-live="polite"></div>

      <div class="btn-row" style="margin-top: 1.5rem">
        <a class="btn" href="about.html" data-testid="link-to-about">Go to About</a>
        <a class="btn" href="index.html" data-testid="link-to-home">Back to Home</a>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
